<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Render hero group</title>
  <style>
    html, body { margin: 0; background: transparent; }
    svg { display: block; }
  </style>
</head>
<body>
  <!--
    Rebuilds Figma's hero "Mask group" (node 2:101) with real transparency.
    Figma's PNG export flattens it onto grey, so instead this loads Figma's SVG
    export of the group (its fade mask and Noise effect filter) and puts the
    original photo back in. Screenshot the <svg> with a transparent background
    at 1341 × 1994 to produce figma-assets/hero-group.png (see README).
  -->
  <script type="module">
    const svgText = await (await fetch("../figma-assets/hero-group.svg")).text();
    document.body.insertAdjacentHTML("afterbegin", svgText);

    const rect = document.querySelector('[id="Sana Grillo-110 1"]');
    const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
    for (const attr of ["x", "y", "width", "height"]) image.setAttribute(attr, rect.getAttribute(attr));
    image.setAttribute("preserveAspectRatio", "xMidYMid slice");
    image.addEventListener("load", () => { document.body.dataset.ready = "true"; });
    image.setAttribute("href", "../figma-assets/hero-photo.png");
    rect.replaceWith(image);
  </script>
</body>
</html>
